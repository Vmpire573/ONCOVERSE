services:
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
      POSTGRES_USER: ${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in your shell}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in your shell}
    volumes:
      - oncoverse_airflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    build:
      context: .
      dockerfile: orchestration/airflow/Dockerfile
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}@airflow-db/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/orchestration/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://oncoverse:oncoverse@db:5432/oncoverse
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      ONCOVERSE_PROJECT_ROOT: /opt/airflow/project
      ONCOVERSE_PYTHON: /home/airflow/oncoverse-venv/bin/python
      ONCOVERSE_INPUT_CSV: ${ONCOVERSE_INPUT_CSV:-}
      ONCOVERSE_MAPPING_JSON: ${ONCOVERSE_MAPPING_JSON:-}
    volumes:
      - ./:/opt/airflow/project
    user: "${AIRFLOW_UID:-50000}:0"
    command:
      - bash
      - -c
      - airflow db migrate && (airflow users create --username oncoverse --password "$$AIRFLOW_ADMIN_PASSWORD" --firstname OncoVerse --lastname Admin --role Admin --email admin@example.invalid || true)
    depends_on:
      db:
        condition: service_healthy
      airflow-db:
        condition: service_healthy

  airflow-webserver:
    build:
      context: .
      dockerfile: orchestration/airflow/Dockerfile
    environment: *airflow-environment
    volumes:
      - ./:/opt/airflow/project
    user: "${AIRFLOW_UID:-50000}:0"
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: .
      dockerfile: orchestration/airflow/Dockerfile
    environment: *airflow-environment
    volumes:
      - ./:/opt/airflow/project
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  oncoverse_airflow_pg:
